name: Probe sources (temporary)

# Read-only probe for the 2026-10-05 universe update. Runs only on the feature
# branch and writes nothing. Removed before merge.
on:
  push:
    branches: ['claude/beautiful-cray-33bgwc']
    paths: ['scripts/probe-sources.js', '.github/workflows/probe-sources.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/probe-sources.js
